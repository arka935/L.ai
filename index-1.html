<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Overview — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #05030a;
    --purple-dark: #150a28;
    --purple-mid: #2b1250;
    --violet: #9333ea;
    --violet-light: #c084fc;
    --glow: rgba(147,51,234,0.45);
    --text-primary: #f3f0fa;
    --text-muted: #a596c4;
    --card-bg: rgba(24,12,42,0.55);
    --card-border: rgba(168,85,247,0.18);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--black);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    background:
      radial-gradient(ellipse 80% 50% at 15% -10%, rgba(147,51,234,0.28), transparent 60%),
      radial-gradient(ellipse 70% 60% at 100% 10%, rgba(88,28,135,0.35), transparent 55%),
      linear-gradient(160deg, var(--black) 0%, var(--purple-dark) 45%, #0a0512 100%);
    min-height:100vh;
    position:relative;
  }

  /* ambient blurred orbs for realistic depth */
  .orb{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    pointer-events:none;
    z-index:0;
    opacity:0.55;
  }
  .orb-1{ width:420px; height:420px; background:var(--purple-mid); top:-120px; left:-100px; animation: drift1 22s ease-in-out infinite; }
  .orb-2{ width:340px; height:340px; background: rgba(147,51,234,0.5); bottom:-140px; right:-80px; animation: drift2 26s ease-in-out infinite; }
  .orb-3{ width:260px; height:260px; background: rgba(60,20,100,0.6); top:40%; right:20%; animation: drift1 30s ease-in-out infinite reverse; }

  @keyframes drift1{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(40px,30px); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-30px,-40px); }
  }

  .page{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding: 22px 20px 60px;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 4px 0;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brandmark .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--violet-light);
    box-shadow: 0 0 12px 3px var(--glow);
  }
  .brandmark span{
    font-family:'Sora', sans-serif;
    font-size:12px;
    letter-spacing:0.22em;
    color: var(--text-muted);
    text-transform:uppercase;
  }
  .clock{
    font-family:'Sora', sans-serif;
    font-size:13px;
    color: var(--text-muted);
    letter-spacing:0.03em;
  }

  /* welcome animated text */
  .welcome-track{
    position:relative;
    height: 130px;
    overflow:hidden;
    margin-top: 10px;
  }
  .welcome-text{
    position:absolute;
    top:50%;
    left:0;
    margin-top:-34px;
    white-space:nowrap;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size: clamp(2.1rem, 8vw, 3.6rem);
    letter-spacing:-0.01em;
    background: linear-gradient(90deg, #d8b4fe, #a855f7 45%, #7e22ce);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 26px rgba(168,85,247,0.55));
    transform: translateX(105vw);
    animation: welcomeSlide 7.5s cubic-bezier(.45,0,.4,1) 0.3s forwards;
  }

  @keyframes welcomeSlide{
    0%   { transform: translateX(105vw); opacity:0; }
    14%  { opacity:1; }
    68%  { opacity:1; transform: translateX(-15vw); }
    100% { transform: translateX(-70vw); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .welcome-text{ animation: none; opacity:1; transform: translateX(0); position:static; }
    .orb{ animation:none; }
  }

  /* dashboard section */
  .section-label{
    font-family:'Sora', sans-serif;
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--text-muted);
    margin: 8px 0 16px 4px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap:18px;
  }

  .card{
    position:relative;
    display:block;
    text-decoration:none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 26px 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 24px 60px -20px rgba(0,0,0,0.75),
      inset 0 1px 0 rgba(255,255,255,0.04);
    transition: transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s ease, border-color .35s ease;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 30% 0%, rgba(168,85,247,0.18), transparent 60%);
    opacity:0;
    transition: opacity .35s ease;
  }

  .card-featured{
    border-color: rgba(192,132,252,0.35);
    box-shadow:
      0 30px 70px -18px rgba(88,28,135,0.55),
      0 0 0 1px rgba(168,85,247,0.15) inset;
  }

  .card:active{ transform: scale(0.98); }

  a.card:hover, a.card:focus-visible{
    transform: translateY(-5px);
    border-color: rgba(192,132,252,0.5);
    box-shadow:
      0 34px 80px -18px rgba(88,28,135,0.7),
      0 0 40px -6px var(--glow);
    outline:none;
  }
  a.card:hover::before{ opacity:1; }

  .card-icon{
    width:46px; height:46px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(145deg, rgba(147,51,234,0.35), rgba(88,28,135,0.25));
    border:1px solid rgba(192,132,252,0.3);
    margin-bottom:18px;
  }
  .card-icon svg{ width:22px; height:22px; }

  .card-title{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }

  .card-desc{
    font-size:0.9rem;
    color: var(--text-muted);
    line-height:1.5;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.68rem;
    font-family:'Sora', sans-serif;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: var(--violet-light);
    background: rgba(147,51,234,0.15);
    border:1px solid rgba(168,85,247,0.3);
    padding:4px 10px;
    border-radius:999px;
    margin-top:16px;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--violet-light); box-shadow:0 0 8px 2px var(--glow); }

  /* locked / coming soon cards */
  .card-locked{
    opacity:0.55;
    cursor:not-allowed;
    filter: grayscale(0.3);
  }
  .card-locked .card-icon{
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
  }
  .lock-tag{
    position:absolute;
    top:20px; right:20px;
    font-size:0.65rem;
    font-family:'Sora', sans-serif;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color: var(--text-muted);
    border:1px solid rgba(255,255,255,0.12);
    padding:3px 9px;
    border-radius:999px;
  }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="page">

    <div class="topbar">
      <div class="brandmark">
        <div class="dot"></div>
        <span>Overview</span>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>

    <div class="welcome-track">
      <h1 class="welcome-text">Selamat Datang</h1>
    </div>

    <div class="section-label">Aplikasi</div>

    <div class="grid">

      <a class="card card-featured" href="app-builder.html">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/>
          </svg>
        </div>
        <div class="card-title">App Builder</div>
        <div class="card-desc">Bikin aplikasi Android langsung dari obrolan AI — kode dan langkah deploy siap pakai.</div>
        <div class="badge"><span class="dot"></span> Powered by L.ai</div>
      </a>

      <div class="card card-locked">
        <div class="lock-tag">Segera Hadir</div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c9c2d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="12" rx="3"/><circle cx="8" cy="13" r="1.6"/><circle cx="16" cy="13" r="1.6"/>
          </svg>
        </div>
        <div class="card-title">Game Center</div>
        <div class="card-desc">Kumpulan mini game langsung di dashboard.</div>
      </div>

      <div class="card card-locked">
        <div class="lock-tag">Segera Hadir</div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c9c2d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.5-3.5a5 5 0 01-6.7 6.7L6 21l-3-3 8.5-8.5a5 5 0 016.7-6.7l-3.5 3.5z"/>
          </svg>
        </div>
        <div class="card-title">AI Tools Suite</div>
        <div class="card-desc">Kumpulan utilitas AI dalam satu tempat.</div>
      </div>

    </div>

  </div>

<script>
  function updateClock(){
    var d = new Date();
    var h = String(d.getHours()).padStart(2,'0');
    var m = String(d.getMinutes()).padStart(2,'0');
    var el = document.getElementById('clock');
    if(el) el.textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 15000);
</script>

</body>
</html>
