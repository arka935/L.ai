<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>L.ai — App Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #05030a;
    --purple-dark: #150a28;
    --purple-mid: #2b1250;
    --violet: #9333ea;
    --violet-light: #c084fc;
    --glow: rgba(147,51,234,0.45);
    --text-primary: #f3f0fa;
    --text-muted: #a596c4;
    --bubble-ai: rgba(24,12,42,0.65);
    --bubble-user: linear-gradient(135deg, #7e22ce, #a855f7);
    --border: rgba(168,85,247,0.18);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(ellipse 80% 50% at 10% -10%, rgba(147,51,234,0.25), transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(88,28,135,0.3), transparent 55%),
      linear-gradient(160deg, var(--black) 0%, var(--purple-dark) 45%, #0a0512 100%);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,5,18,0.4);
    backdrop-filter: blur(14px);
    flex-shrink:0;
  }
  .back{
    width:34px; height:34px;
    border-radius:11px;
    border:1px solid var(--border);
    background: rgba(255,255,255,0.03);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted);
    text-decoration:none;
    flex-shrink:0;
  }
  .back svg{ width:16px; height:16px; }
  .brand-icon{
    width:38px; height:38px;
    border-radius:12px;
    background: linear-gradient(145deg, rgba(147,51,234,0.4), rgba(88,28,135,0.3));
    border:1px solid rgba(192,132,252,0.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:14px;
    color:#e9d5ff;
    flex-shrink:0;
  }
  .brand-text{ line-height:1.25; flex:1; }
  .brand-text .name{ font-family:'Sora', sans-serif; font-weight:700; font-size:1rem; }
  .brand-text .sub{ font-size:0.72rem; color: var(--text-muted); }
  .new-chat-btn{
    display:flex; align-items:center; gap:6px;
    padding:8px 12px;
    border-radius:11px;
    border:1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-muted);
    font-family:'Sora', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .new-chat-btn:active{ transform: scale(0.95); }
  .new-chat-btn svg{ width:14px; height:14px; }

  main{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .msg{
    max-width:82%;
    padding:12px 16px;
    border-radius:18px;
    font-size:0.92rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.ai{
    align-self:flex-start;
    background: var(--bubble-ai);
    border:1px solid var(--border);
    border-bottom-left-radius:6px;
    backdrop-filter: blur(10px);
  }
  .msg.user{
    align-self:flex-end;
    background: var(--bubble-user);
    color:#fff;
    border-bottom-right-radius:6px;
    box-shadow: 0 10px 30px -10px rgba(147,51,234,0.6);
  }
  .msg code{
    font-family:'JetBrains Mono', monospace;
    background: rgba(0,0,0,0.35);
    padding:2px 6px;
    border-radius:6px;
    font-size:0.85em;
  }
  .code-block{
    position:relative;
    background: rgba(0,0,0,0.45);
    border:1px solid rgba(168,85,247,0.2);
    border-radius:12px;
    margin:10px 0;
    overflow:hidden;
  }
  .code-block pre{
    padding:14px;
    overflow-x:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
    line-height:1.5;
    color:#e9d5ff;
  }
  .copy-btn{
    position:absolute;
    top:8px; right:8px;
    font-family:'Sora', sans-serif;
    font-size:0.65rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color: var(--text-muted);
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:7px;
    padding:5px 9px;
    cursor:pointer;
  }
  .copy-btn:active{ transform: scale(0.95); }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:14px 18px;
    background: var(--bubble-ai);
    border:1px solid var(--border);
    border-radius:18px;
    border-bottom-left-radius:6px;
  }
  .typing span{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--violet-light);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform: translateY(0); opacity:0.5; }
    30%{ transform: translateY(-5px); opacity:1; }
  }

  footer{
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background: rgba(10,5,18,0.5);
    backdrop-filter: blur(14px);
    flex-shrink:0;
  }
  .input-row{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 8px 8px 16px;
  }
  #promptInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color: var(--text-primary);
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    max-height:110px;
    line-height:1.4;
    padding:6px 0;
  }
  #promptInput::placeholder{ color: var(--text-muted); }
  #sendBtn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    flex-shrink:0;
    background: linear-gradient(135deg, #7e22ce, #a855f7);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 20px -6px rgba(147,51,234,0.7);
    transition: transform .15s ease, opacity .15s ease;
  }
  #sendBtn:active{ transform: scale(0.92); }
  #sendBtn:disabled{ opacity:0.4; cursor:not-allowed; }
  #sendBtn svg{ width:17px; height:17px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html" aria-label="Kembali">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="brand-icon">L</div>
  <div class="brand-text">
    <div class="name">L.ai</div>
    <div class="sub">App Builder · by Alex</div>
  </div>
  <button class="new-chat-btn" id="newChatBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Baru
  </button>
</header>

<main id="chatWindow"></main>

<footer>
  <div class="input-row">
    <textarea id="promptInput" rows="1" placeholder="Ceritain aplikasi Android yang mau kamu buat..."></textarea>
    <button id="sendBtn" aria-label="Kirim">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</footer>

<script>
  var chatWindow = document.getElementById('chatWindow');
  var promptInput = document.getElementById('promptInput');
  var sendBtn = document.getElementById('sendBtn');
  var newChatBtn = document.getElementById('newChatBtn');

  var STORAGE_KEY = 'lai_chat_history';
  var GREETING = 'Halo! Aku L.ai, siap bantu bikin aplikasi Android kamu dari nol sampai siap deploy. Mau bikin aplikasi apa hari ini?';

  var history = [];
  var isSending = false; // kunci utama biar gak bisa kirim dobel/spam

  function showDebugError(msg){
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:10px 14px;font-size:11px;font-family:monospace;z-index:9999;word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,0.5);';
    bar.textContent = 'Error: ' + msg;
    document.body.appendChild(bar);
    setTimeout(function(){ bar.remove(); }, 10000);
  }
  window.addEventListener('error', function(e){ showDebugError(e.message); });
  window.addEventListener('unhandledrejection', function(e){
    showDebugError((e.reason && e.reason.message) || String(e.reason));
  });

  function saveHistory(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }catch(e){}
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderContent(text){
    var escaped = escapeHtml(text);
    escaped = escaped.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code){
      return '<div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre><code>' + code + '</code></pre></div>';
    });
    escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return escaped;
  }

  function copyCode(btn){
    var code = btn.parentElement.querySelector('code').innerText;
    navigator.clipboard.writeText(code).then(function(){
      var old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = old; }, 1500);
    });
  }

  function addMessage(role, text){
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    div.innerHTML = renderContent(text);
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function showTyping(){
    var div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function hideTyping(){
    var els = document.querySelectorAll('.typing');
    els.forEach(function(el){ el.remove(); });
  }

  function autoResize(){
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight, 110) + 'px';
  }
  promptInput.addEventListener('input', autoResize);
  promptInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if(isSending) return; // cegah spam via tombol Enter/Go di keyboard HP
      handleSend();
    }
  });

  sendBtn.addEventListener('click', function(){
    if(isSending) return;
    handleSend();
  });

  newChatBtn.addEventListener('click', function(){
    if(isSending) return;
    startNewChat();
  });

  function handleSend(){
    var text = promptInput.value.trim();
    if(!text || isSending) return;

    try{
      isSending = true;
      addMessage('user', text);
      history.push({ role:'user', content: text });
      saveHistory();
      promptInput.value = '';
      autoResize();
      sendBtn.disabled = true;
      hideTyping();
      showTyping();
    }catch(err){
      isSending = false;
      sendBtn.disabled = false;
      hideTyping();
      addMessage('ai', 'Ada error internal: ' + err.message);
      return;
    }

    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 25000);

    fetch('/.netlify/functions/chat', {
      method:'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: controller.signal
    })
    .then(function(res){
      if(!res.ok) throw new Error('Server balas status ' + res.status);
      return res.json();
    })
    .then(function(data){
      hideTyping();
      var reply = data.reply || 'Maaf, L.ai belum bisa menjawab itu sekarang.';
      addMessage('ai', reply);
      history.push({ role:'assistant', content: reply });
      saveHistory();
    })
    .catch(function(err){
      hideTyping();
      if(err && err.name === 'AbortError'){
        addMessage('ai', 'Maaf, L.ai kelamaan mikir (timeout 25 detik). Coba kirim ulang.');
      } else {
        addMessage('ai', 'Maaf, L.ai lagi gangguan: ' + (err && err.message ? err.message : 'gagal terhubung ke server') + '. Coba kirim ulang ya.');
      }
    })
    .finally(function(){
      clearTimeout(timeoutId);
      isSending = false;
      sendBtn.disabled = false;
    });
  }

  function startNewChat(){
    history = [];
    localStorage.removeItem(STORAGE_KEY);
    chatWindow.innerHTML = '';
    addMessage('ai', GREETING);
  }

  // muat riwayat chat dari localStorage (kalau ada), lalu tampilkan sapaan + riwayatnya
  (function init(){
    try{
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved) history = JSON.parse(saved) || [];
    }catch(e){ history = []; }

    addMessage('ai', GREETING);
    history.forEach(function(m){
      addMessage(m.role === 'user' ? 'user' : 'ai', m.content);
    });
  })();
</script>

</body>
</html>
